<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
  <!-- Top Header Bar -->
  <header class="bg-white shadow px-8 py-4">
    <div class="flex items-center gap-8">
      <img src="APP_LOGO.avif" alt="App Logo" class="h-10 w-auto" />

      <span class="text-lg font-semibold text-blue-600 cursor-pointer">
        Users
      </span>

      <span class="text-lg text-gray-600 hover:text-blue-600 cursor-pointer">
        Roles
      </span>

      <span class="text-lg text-gray-600 hover:text-blue-600 cursor-pointer">
        Access Rights
      </span>

    </div>
          <div>
      <input
        id="searchInput"
        type="text"
        placeholder="Search"
        class="border rounded px-4 py-2"
      />
      </div>
  </header>

  <div class="flex min-h-screen">
     
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md p-6">
      <h2 class="text-xl font-bold mb-6">Dashboard</h2>
      <ul class="space-y-4 text-gray-600">
        <li class="font-semibold text-blue-600">Users</li>
        <li>Tasks</li>
        <li>Calendar</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
     
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold">User List</h1>
      </div>

      <!-- Table -->
      <div class="bg-white rounded shadow">
        <table class="w-full">
          <thead class="border-b text-gray-500">
            <tr>
              <th class="text-left p-4">Name</th>
              <th class="text-left p-4">Login</th>
              <th class="text-left p-4">Project</th>
              <th class="text-left p-4">Status</th>
              <th class="text-left p-4">Role</th>
            </tr>
          </thead>

          <tbody id="userTable"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
